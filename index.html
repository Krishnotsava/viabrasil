<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Via Brasil | Alta Perfumaria & Nicho</title>
    <meta name="description" content="Via Brasil - Importadora e Distribuidora de Alta Perfumaria e Fragrâncias de Nicho em Ciudad del Este, Paraguai. Fundada em 1993.">
    
    <!-- SEO Language Alternatives -->
    <link rel="alternate" hreflang="x-default" href="https://viabrasil.com.py/" />
    <link rel="alternate" hreflang="es" href="https://viabrasil.com.py/es/" />
    <link rel="alternate" hreflang="en" href="https://viabrasil.com.py/en/" />

    <style>
        body {
            background-color: #13123A;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #C5A880;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            font-size: 14px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.8;
        }
    </style>
    
    <script>
        (function() {
            var preferredLanguage;
            try {
                preferredLanguage = localStorage.getItem('via_brasil_lang');
            } catch (e) {
                console.warn('localStorage is blocked:', e);
            }
            
            if (!preferredLanguage) {
                var browserLang = navigator.language || navigator.userLanguage || 'es';
                browserLang = browserLang.toLowerCase();
                
                if (browserLang.startsWith('en')) {
                    preferredLanguage = 'en';
                } else {
                    preferredLanguage = 'es'; // Default fallback
                }
            }
            if (preferredLanguage !== 'en' && preferredLanguage !== 'es') {
                preferredLanguage = 'es';
            }
            
            window.location.replace('./' + preferredLanguage + '/index.html');
        })();
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Via Brasil | Loading...</p>
    </div>
</body>
</html>
